# QQ 官方机器人（开放平台）适配器配置
# 在 QQ 开放平台管理端 (https://q.qq.com) 创建机器人后，把 AppID 和 AppSecret 填到 accounts 下即可
# 可以配置多个机器人账号，每个账号一条
#
# intents（可选）：事件订阅位，按位或叠加，不填使用默认值
#   默认值 = 单聊(1<<25) | 频道公域@消息(1<<30) | 频道私信(1<<12)
#   常用位：
#     1<<25  群聊@消息 / 单聊 / 好友与群成员变动
#     1<<30  频道公域 @机器人消息
#     1<<9   频道全部消息（仅私域机器人有权限）
#     1<<12  频道私信
#
# accounts:
#   - appid: "11111111"
#     secret: "DG5g3B4j9X2KOErG"
#     intents: 1107328512
