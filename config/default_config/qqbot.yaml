# ===================== QQ 官方机器人（开放平台）适配器配置 =====================
#
# 【这是什么】
#   让 Yunzai 接入 QQ 官方机器人的配置。官方机器人不是普通 QQ 号登录，
#   而是在腾讯开放平台注册的机器人应用，收发消息走腾讯服务器，不需要扫码。
#
# 【配置步骤】
#   1. 打开 QQ 机器人开放平台 https://q.qq.com 用 QQ 号登录
#   2. 创建一个机器人应用，审核通过后才能正常使用
#   3. 进入管理端，找到「开发设置」页，能看到两个东西：
#        - AppID（机器人 ID，一串数字）
#        - AppSecret（机器人密钥，点「显示」或「重置」可以看到）
#   4. 照着下面 accounts 里的示例，把这两个值填进去
#   5. 保存本文件后重启 Yunzai，日志里出现
#      「QQ官方机器人(你的AppID) 已连接」即为成功
#
# 【注意事项】
#   - 可以同时填多个机器人账号，每条 - appid 开头写一个
#   - AppSecret 是密钥，不要截图/发给别人
#   - 机器人必须在平台上「上线」并添加进群/频道才会收到消息
#   - 群聊里需要 @机器人 才能触发回复，这是官方平台的限制
#   - 本体默认命令前缀是 #，官方群消息收到什么就处理什么，
#     所以群里要发 「#@帮助」 这样（带 # 号）
#
# 【intents 说明（可选，看不懂就不填，用默认值）】
#   intents 决定机器人订阅哪些事件，多个值用位或(+)叠加，如：1073741824 + 33554432
#     1<<25  群聊@消息、单聊、好友/群成员变动（建议保留）
#     1<<30  频道公域 @机器人消息（建议保留）
#     1<<12  频道私信
#     1<<9   频道全部消息（仅私域机器人有权限，没权限填了会连不上）
#   不填默认 = 1<<25 + 1<<30 + 1<<12，覆盖单聊+群聊+频道公域+频道私信
#
# 【配置示例】
# accounts:
#   - appid: "11111111"
#     secret: "DG5g3B4j9X2KOErG"
#     intents: 1107328512
#
#   两个机器人的写法：
# accounts:
#   - appid: "11111111"
#     secret: "第一个机器人的密钥"
#   - appid: "22222222"
#     secret: "第二个机器人的密钥"
