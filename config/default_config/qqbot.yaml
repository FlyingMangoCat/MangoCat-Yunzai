# ===================== QQ 官方机器人（开放平台）适配器配置 =====================
#
# 【这是什么】
#   让 Yunzai 接入 QQ 官方机器人的配置。官方机器人不是普通 QQ 号登录，
#   而是在腾讯开放平台注册的机器人应用，收发消息走腾讯服务器，不需要扫码。
#
# 【怎么填】三步：
#   1. 打开 QQ 机器人开放平台 https://q.qq.com 用 QQ 号登录
#   2. 创建机器人应用（需审核），审核通过后在管理端「开发设置」页拿到
#        AppID    —— 一串数字
#        AppSecret —— 密钥，点「显示」或「重置」可查看
#   3. 把下面 accounts 里的 "在此填入AppID" 和 "在此填入AppSecret" 换成你的值，
#      保存后重启 Yunzai，日志出现「QQ官方机器人(xxx) 已连接」即为成功
#
# 【注意事项】
#   - 多个机器人就在 accounts 下继续加一行 "  - appid: ..." 起的新条目
#   - AppSecret 是密钥，不要截图/发给别人
#   - 机器人必须在平台上「上线」并添加进群/频道才会收到消息
#   - 群聊里需要 @机器人 才能触发回复，这是官方平台的限制
#   - 本体默认命令前缀是 #，群里发「#@帮助」这样的形式
#   - intents 不填使用默认值（单聊+群聊+频道公域+频道私信），
#     频道私域等特殊权限申请下来后再加，位运算取值参考：
#       1<<25 群聊/单聊  1<<30 频道公域  1<<12 频道私信  1<<9 频道全部消息(仅私域)
#
# accounts 不填或全部留空时，适配器不加载，不影响本体启动
accounts:
  - appid: "在此填入AppID"
    secret: "在此填入AppSecret"
    # intents: 1107328512
