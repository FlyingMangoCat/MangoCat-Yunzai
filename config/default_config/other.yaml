# 是否自动同意加好友 1-同意 0-不处理
autoFriend: 1
# 是否自动退群人数，当被好友拉进群时，群人数小于配置值自动退出， 默认50，0则不处理
autoQuit: 50
# 主人QQ号
masterQQ:

# 禁用私聊功能 true：私聊只接受ck以及抽卡链接（Bot主人不受限制），false：私聊可以触发全部指令，默认false
disablePrivate: false
# 禁用私聊Bot提示内容
disableMsg: "私聊功能已禁用，仅支持发送cookie，抽卡记录链接，记录日志文件"
# 私聊通行字符串
disableAdopt:
  - stoken
#白名单群，配置后只在该群生效
whiteGroup:

#黑名单群
blackGroup:
  - 213938015
#黑名单qq
blackQQ:
  - 528952540

# 数据保护层：拦截插件删除 config/data 核心目录等危险操作
# true-启用 false-关闭（关闭后插件可删除任意文件，不推荐）
dataGuard: true
# 删除前自动备份目录（相对项目根目录），一般危险操作删除前会备份到这里供恢复
dataBackupPath: .backup

# 命令执行保护层：拦截插件执行 rm 删除核心目录、curl|bash 远程脚本执行等危险命令
# true-启用 false-关闭（关闭后插件可执行任意系统命令，不推荐）
cmdGuard: true

# 插件硬编码后门清洗：加载插件时自动检测并删除源码中的硬编码后门
# （如 data:text/javascript 内联代码、md5(user_id) 授权比较），仅删后门行，其余代码不动
# true-启用 false-关闭（关闭后不扫描插件源码，不推荐）
pluginScan: true
